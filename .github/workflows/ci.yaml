name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # nix flake check's pre-commit-check derivation already enforces
      # formatting (the nixfmt hook) -- no separate `nix fmt` step needed,
      # and `formatter` here is a raw nixfmt-rfc-style, not a treefmt
      # wrapper, so it has no --fail-on-change flag to invoke anyway.
      - run: nix flake check -L
